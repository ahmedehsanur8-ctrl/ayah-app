# Builds the release APK and the Play Store App Bundle (.aab), both signed with
# the permanent release key.
# - The version comes from `version:` in pubspec.yaml (name+code). Raise it for
#   every release: Google Play rejects a version code it has already seen.
# - Push to main (or a manual run with "publish_release"): the APK and AAB are
#   attached to a new GitHub Release, tagged v<version name>. If that tag
#   already exists (version not raised), nothing is published.
# - Push to any other branch: they are saved as downloadable build artifacts.
# The key comes from GitHub Secrets (see docs/SIGNING.md). The build fails if
# the key is missing or a file is not signed with it, so an unsigned or
# wrongly signed build is never published.
name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      install_test:
        description: "Publish an install-test pre-release (T1, T2, T3) instead of a normal release"
        type: boolean
        default: false
      publish_release:
        description: "Publish a GitHub Release with the APK and AAB from this branch"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Read version from pubspec.yaml
        run: |
          VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          NAME="${VERSION%%+*}"
          CODE="${VERSION##*+}"
          if [ -z "$NAME" ] || [ "$NAME" = "$VERSION" ] || ! [[ "$CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::pubspec.yaml version must look like 1.0.70+70 (name+code), got '$VERSION'"
            exit 1
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Version $NAME (code $CODE)"

      - name: Check code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Check EveryAyah.com recitation URLs
        continue-on-error: true
        run: |
          for r in Alafasy_128kbps Abdul_Basit_Murattal_192kbps Husary_128kbps; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "https://everyayah.com/data/$r/039053.mp3")
            echo "$r: HTTP $code"
            [ "$code" = "200" ] || echo "::warning::EveryAyah reciter $r returned HTTP $code"
          done

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The GitHub secret ANDROID_${name} is missing. Add it under Settings > Secrets and variables > Actions (see docs/SIGNING.md)."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build apk --release
          --build-name=$VERSION_NAME
          --build-number=$VERSION_CODE

      # The App Bundle for Google Play, signed by Gradle with the same key
      # (this is the upload key in Play Console).
      - name: Build release App Bundle (.aab)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build appbundle --release
          --build-name=$VERSION_NAME
          --build-number=$VERSION_CODE

      # Sign with v1 + v2 + v3 so strict phone installers (e.g. some Oppo/ColorOS
      # versions) accept the APK. Gradle skips v1 for minSdk 24+, so apksigner
      # re-signs the Gradle output; --min-sdk-version 21 makes it add v1.
      - name: Sign with v1 + v2 + v3
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          "${BT}apksigner" sign --ks "$ANDROID_KEYSTORE_PATH" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --out "$RUNNER_TEMP/signed.apk" "$APK"
          mv "$RUNNER_TEMP/signed.apk" "$APK"

      # Test copies to find what a phone's installer refuses (all v1 + v2 + v3, same key):
      #   T1: the app as released
      #   T2: T1 without the azan sound file
      #   T3: the app built without the location permission
      - name: Build install-test copies T1, T2, T3
        if: inputs.install_test
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          V=$VERSION_NAME
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          sign() {
            "${BT}apksigner" sign --ks "$ANDROID_KEYSTORE_PATH" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true \
              --v3-signing-enabled true --out "$2" "$1"
            "${BT}apksigner" verify --min-sdk-version 21 "$2"
          }
          mkdir -p dist-test
          cp "$APK" "dist-test/T1-full-$V.apk"
          # T2: remove the azan sound (its file name in the APK is shortened by the build).
          AZAN="$("${BT}aapt2" dump resources "$APK" | grep -A2 'raw/azan' | grep -oE 'res/[^ ]*\.(mp3|webm|ogg)' | head -1)"
          echo "azan file in APK: $AZAN"
          [ -n "$AZAN" ]
          cp "$APK" "$RUNNER_TEMP/t2.apk"
          zip -q -d "$RUNNER_TEMP/t2.apk" "$AZAN" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/MANIFEST.MF'
          "${BT}zipalign" -P 16 -f 4 "$RUNNER_TEMP/t2.apk" "$RUNNER_TEMP/t2a.apk"
          sign "$RUNNER_TEMP/t2a.apk" "dist-test/T2-no-azan-sound-$V.apk"
          # T3: build again without the location permission.
          sed -i '/ACCESS_COARSE_LOCATION/d; /android.hardware.location/d; /sensor.compass/d' android/app/src/main/AndroidManifest.xml
          flutter build apk --release --build-name=$V --build-number=$VERSION_CODE
          git checkout android/app/src/main/AndroidManifest.xml
          sign "$APK" "dist-test/T3-no-location-permission-$V.apk"
          cp "dist-test/T1-full-$V.apk" "$APK"
          ls -la dist-test

      - name: Remove signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify the APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          # --min-sdk-version 21 makes apksigner check the v1 signature too.
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 21 "$APK" | tee apksigner.txt
          grep -q "^Verifies" apksigner.txt
          grep -q "Verified using v1 scheme (JAR signing): true" apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" apksigner.txt
          EXPECTED="$(tr -d '[:space:]' < android/release-signing-sha256.txt)"
          ACTUAL="$(grep -m1 'certificate SHA-256 digest:' apksigner.txt | awk '{print $NF}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK is signed with $ACTUAL, expected the release key $EXPECTED"
            exit 1
          fi
          echo "APK is signed with the permanent release key."

      - name: Verify the App Bundle signature
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tee jarsigner.txt
          grep -q "jar verified" jarsigner.txt
          EXPECTED="$(tr -d '[:space:]' < android/release-signing-sha256.txt)"
          ACTUAL="$(keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::AAB is signed with $ACTUAL, expected the release key $EXPECTED"
            exit 1
          fi
          echo "AAB is signed with the permanent release key."

      # Hidden files (like assets/story_audio/.gitkeep) must never be packaged:
      # an Oppo/ColorOS phone refused such APKs with "APK contains no signature files".
      - name: Check for hidden files in the APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if unzip -Z1 "$APK" | grep -E '(^|/)\.'; then
            echo "::error::The APK contains hidden files (listed above). Remove them from assets."
            exit 1
          fi
          echo "No hidden files."

      - name: Rename APK and AAB
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/AyahReminder-$VERSION_NAME.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/AyahReminder-$VERSION_NAME.aab"

      - name: Upload APK and AAB as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyahReminder-${{ env.VERSION_NAME }}
          path: |
            dist/*.apk
            dist/*.aab

      # The APK alone, for installing on a phone: one file, stored without
      # extra compression (an APK is already compressed), so phone unzip apps
      # open it easily and there is no App Bundle to unpack as well.
      - name: Upload APK only (for phones)
        uses: actions/upload-artifact@v4
        with:
          name: AyahReminder-${{ env.VERSION_NAME }}-APK-only
          path: dist/*.apk
          compression-level: 0

      - name: Check the release tag is new
        id: tag
        if: (github.ref == 'refs/heads/main' || inputs.publish_release) && !inputs.install_test
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION_NAME" >/dev/null; then
            echo "::warning::Release v$VERSION_NAME already exists. Raise the version in pubspec.yaml to publish a new release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish install-test pre-release
        if: inputs.install_test
        uses: softprops/action-gh-release@v2
        with:
          tag_name: install-test-${{ github.run_number }}
          name: Install test ${{ github.run_number }} (T1, T2, T3)
          prerelease: true
          body: |
            Test copies of Ayah Reminder ${{ env.VERSION_NAME }}, all signed with the permanent key (v1 + v2 + v3).
            - **T1**: the full app
            - **T2**: the full app without the azan sound file
            - **T3**: the full app without the location permission
          files: dist-test/*.apk

      - name: Publish GitHub Release
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Ayah Reminder ${{ env.VERSION_NAME }}
          body: |
            Version ${{ env.VERSION_NAME }} (version code ${{ env.VERSION_CODE }}).
            - **AyahReminder-${{ env.VERSION_NAME }}.apk**: download and open it on your Android phone.
            - **AyahReminder-${{ env.VERSION_NAME }}.aab**: upload this App Bundle to Google Play Console.
            Both are signed with the permanent Ayah Reminder release key (the Play upload key), so later versions install over this one.
          files: |
            dist/*.apk
            dist/*.aab
