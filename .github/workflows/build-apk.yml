# Builds the release APK, signed with the permanent release key.
# - Push to main: the APK is attached to a new GitHub Release (Releases page).
# - Push to any other branch: the APK is saved as a downloadable build artifact.
# The key comes from GitHub Secrets (see docs/SIGNING.md). The build fails if
# the key is missing or the APK is not signed with it, so an unsigned or
# wrongly signed APK is never published.
name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      signing_test:
        description: "Publish a test pre-release (A, B, C variants) instead of a normal release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Check EveryAyah.com recitation URLs
        continue-on-error: true
        run: |
          for r in Alafasy_128kbps Abdul_Basit_Murattal_192kbps Husary_128kbps; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "https://everyayah.com/data/$r/039053.mp3")
            echo "$r: HTTP $code"
            [ "$code" = "200" ] || echo "::warning::EveryAyah reciter $r returned HTTP $code"
          done

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The GitHub secret ANDROID_${name} is missing. Add it under Settings > Secrets and variables > Actions (see docs/SIGNING.md)."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The run number becomes the version, so each build is a newer update.
        run: >
          flutter build apk --release
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      # Test variants for phones whose installer rejects the normal APK.
      #   A: universal APK (all CPU types), signed v1 + v2 + v3
      #   B: arm64-v8a only (smaller), signed like the normal release (v2 + v3)
      #   C: arm64-v8a only, signed v1 + v2 + v3
      # Gradle skips v1 for minSdk 24+ even with enableV1Signing, so v1 is added
      # with apksigner (--min-sdk-version 21 makes it write the v1 signature).
      - name: Build test variants A, B, C
        if: inputs.signing_test
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          V=1.0.${{ github.run_number }}
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          mkdir -p dist-test
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/universal.apk"
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name=$V --build-number=${{ github.run_number }}
          ARM=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          cp "$RUNNER_TEMP/universal.apk" build/app/outputs/flutter-apk/app-release.apk
          v123() {
            "${BT}apksigner" sign --ks "$ANDROID_KEYSTORE_PATH" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true \
              --v3-signing-enabled true --out "$2" "$1"
          }
          v123 "$RUNNER_TEMP/universal.apk" "dist-test/A-universal-v1v2v3-$V.apk"
          cp "$ARM" "dist-test/B-arm64-v2v3-$V.apk"
          v123 "$ARM" "dist-test/C-arm64-v1v2v3-$V.apk"
          for f in dist-test/*.apk; do
            echo "=== $f ($(du -h "$f" | cut -f1))"
            "${BT}apksigner" verify --verbose --print-certs --min-sdk-version 21 "$f" \
              | grep -E "^Verifies|DOES NOT|scheme \((JAR|APK Signature Scheme v[23])\)|certificate SHA-256"
          done

      - name: Remove signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify the APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
          # The app needs Android 7.0+, which checks the v2/v3 signature
          # (the old v1 JAR signature is skipped by the build tools).
          grep -q "^Verifies" apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" apksigner.txt
          EXPECTED="$(tr -d '[:space:]' < android/release-signing-sha256.txt)"
          ACTUAL="$(grep -m1 'certificate SHA-256 digest:' apksigner.txt | awk '{print $NF}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK is signed with $ACTUAL, expected the release key $EXPECTED"
            exit 1
          fi
          echo "APK is signed with the permanent release key."

      # Oppo/ColorOS refused APKs that contained a hidden empty file
      # (assets/story_audio/.gitkeep) with "APK contains no signature files".
      - name: Check for hidden files in the APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if unzip -Z1 "$APK" | grep -E '(^|/)\.'; then
            echo "::error::The APK contains hidden files (listed above). Remove them from assets."
            exit 1
          fi
          echo "No hidden files."

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/AyahReminder-1.0.${{ github.run_number }}.apk"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyahReminder-apk
          path: dist/*.apk

      - name: Publish test pre-release
        if: inputs.signing_test
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Install test ${{ github.run_number }} (A, B, C)
          prerelease: true
          body: |
            Test copies of Ayah Reminder 1.0.${{ github.run_number }}, all signed with the permanent key.
            - **A**: all phones (universal), v1 + v2 + v3 signatures
            - **B**: arm64 only (smaller), v2 + v3 signatures (same as normal releases)
            - **C**: arm64 only (smaller), v1 + v2 + v3 signatures
          files: dist-test/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && !inputs.signing_test
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ayah Reminder 1.0.${{ github.run_number }}
          body: |
            Download **AyahReminder-1.0.${{ github.run_number }}.apk** below and open it on your Android phone.
            Signed with the permanent Ayah Reminder release key, so later versions install over this one.
          files: dist/*.apk
