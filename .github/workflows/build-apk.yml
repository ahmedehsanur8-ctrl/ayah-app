# Builds the release APK, signed with the permanent release key.
# - Push to main: the APK is attached to a new GitHub Release (Releases page).
# - Push to any other branch: the APK is saved as a downloadable build artifact.
# The key comes from GitHub Secrets (see docs/SIGNING.md). The build fails if
# the key is missing or the APK is not signed with it, so an unsigned or
# wrongly signed APK is never published.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The GitHub secret ANDROID_${name} is missing. Add it under Settings > Secrets and variables > Actions (see docs/SIGNING.md)."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The run number becomes the version, so each build is a newer update.
        run: >
          flutter build apk --release
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Remove signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify the APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
          grep -q "Verified using v1 scheme (JAR signing): true" apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt
          EXPECTED="$(tr -d '[:space:]' < android/release-signing-sha256.txt)"
          ACTUAL="$(grep -m1 'certificate SHA-256 digest:' apksigner.txt | awk '{print $NF}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK is signed with $ACTUAL, expected the release key $EXPECTED"
            exit 1
          fi
          echo "APK is signed with the permanent release key."

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/AyahReminder-1.0.${{ github.run_number }}.apk"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyahReminder-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ayah Reminder 1.0.${{ github.run_number }}
          body: |
            Download **AyahReminder-1.0.${{ github.run_number }}.apk** below and open it on your Android phone.
            Signed with the permanent Ayah Reminder release key, so later versions install over this one.
          files: dist/*.apk
